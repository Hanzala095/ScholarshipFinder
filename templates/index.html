<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scholarship Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Scholarship Finder</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/search">Search Scholarships</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/add">Admin Add</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    <h1 class="mb-4">All Scholarships</h1>

    <div class="row">
        {% for s in scholarships %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ s.name }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ s.provider }}</h6>
                    <p class="card-text">
                        <b>Eligibility:</b> {{ s.eligibility }}<br>
                        <b>Deadline:</b> {{ s.deadline }}
                    </p>
                    <a href="{{ s.link }}" class="btn btn-primary" target="_blank">Apply Now</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
