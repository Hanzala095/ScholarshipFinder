<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Scholarship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Scholarship Finder</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/search">Search Scholarships</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/add">Admin Add</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    <h1 class="mb-4">Add New Scholarship (Admin Panel)</h1>

    <form method="POST" class="row g-3">
        <div class="col-md-6">
            <label for="name" class="form-label">Scholarship Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="col-md-6">
            <label for="provider" class="form-label">Provider</label>
            <input type="text" class="form-control" id="provider" name="provider" required>
        </div>

        <div class="col-md-12">
            <label for="eligibility" class="form-label">Eligibility</label>
            <textarea class="form-control" id="eligibility" name="eligibility" rows="3" required></textarea>
        </div>

        <div class="col-md-6">
            <label for="deadline" class="form-label">Deadline</label>
            <input type="date" class="form-control" id="deadline" name="deadline" required>
        </div>

        <div class="col-md-6">
            <label for="link" class="form-label">Application Link</label>
            <input type="url" class="form-control" id="link" name="link" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Add Scholarship</button>
        </div>
    </form>
</div>

</body>
</html>
